<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打砖块</title>
<style>
body{margin:0;overflow:hidden;background:#1a1a2e;touch-action:none;}
canvas{display:block;margin:0 auto;background:#16213e;}
#info{position:absolute;top:10px;width:100%;text-align:center;color:#fff;font-family:sans-serif;font-size:18px;pointer-events:none;}
#info span{color:#f5c842;font-weight:bold;}
</style>
</head>
<body>
<div id="info">得分: <span id="score">0</span> | 生命: <span id="lives">3</span></div>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreSpan = document.getElementById('score');
const livesSpan = document.getElementById('lives');

canvas.width = window.innerWidth > 400 ? 400 : window.innerWidth - 20;
canvas.height = canvas.width * 1.5;

const ballRadius = 8;
const paddleHeight = 12;
const paddleWidth = 80;
const brickRowCount = 5;
const brickColumnCount = 7;
const brickWidth = (canvas.width - 40) / brickColumnCount;
const brickHeight = 20;
const brickPadding = 10;
const brickOffsetTop = 30;
const brickOffsetLeft = 20;

let x = canvas.width / 2, y = canvas.height - 30;
let dx = 3, dy = -3;
let paddleX = (canvas.width - paddleWidth) / 2;
let score = 0, lives = 3;
let rightPressed = false, leftPressed = false;
let touchX = 0;

const bricks = [];
for(let c=0; c<brickColumnCount; c++) {
    bricks[c] = [];
    for(let r=0; r<brickRowCount; r++) {
        bricks[c][r] = { x: 0, y: 0, status: 1 };
    }
}

function drawBricks() {
    for(let c=0; c<brickColumnCount; c++) {
        for(let r=0; r<brickRowCount; r++) {
            if(bricks[c][r].status == 1) {
                let brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                let brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                bricks[c][r].x = brickX;
                bricks[c][r].y = brickY;
                ctx.beginPath();
                ctx.rect(brickX, brickY, brickWidth, brickHeight);
                ctx.fillStyle = ["#e74c3c","#e67e22","#f1c40f","#2ecc71","#3498db"][r];
                ctx.fill();
                ctx.closePath();
            }
        }
    }
}

function drawBall() {
    ctx.beginPath();
    ctx.arc(x, y, ballRadius, 0, Math.PI*2);
    ctx.fillStyle = "#e94560";
    ctx.fill();
    ctx.closePath();
}

function drawPaddle() {
    ctx.beginPath();
    ctx.rect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight);
    ctx.fillStyle = "#4CAF50";
    ctx.fill();
    ctx.closePath();
}

function collisionDetection() {
    for(let c=0; c<brickColumnCount; c++) {
        for(let r=0; r<brickRowCount; r++) {
            let b = bricks[c][r];
            if(b.status == 1) {
                if(x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                    dy = -dy;
                    b.status = 0;
                    score++;
                    scoreSpan.textContent = score;
                    if(score == brickRowCount * brickColumnCount) {
                        alert("🎉 恭喜你清空所有砖块！重新开始");
                        document.location.reload();
                    }
                }
            }
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBricks();
    drawBall();
    drawPaddle();
    collisionDetection();
    
    if(x + dx > canvas.width - ballRadius || x + dx < ballRadius) dx = -dx;
    if(y + dy < ballRadius) dy = -dy;
    else if(y + dy > canvas.height - ballRadius - paddleHeight - 10) {
        if(x > paddleX && x < paddleX + paddleWidth) dy = -dy;
        else {
            lives--;
            livesSpan.textContent = lives;
            if(!lives) { alert("💀 游戏结束！"); document.location.reload(); }
            else { x = canvas.width/2; y = canvas.height-30; dx=3; dy=-3; paddleX = (canvas.width-paddleWidth)/2; }
        }
    }
    
    if(rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 7;
    else if(leftPressed && paddleX > 0) paddleX -= 7;
    
    x += dx; y += dy;
    requestAnimationFrame(draw);
}

canvas.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
canvas.addEventListener('touchmove', e => {
    let currentX = e.touches[0].clientX;
    paddleX += (currentX - touchX);
    if(paddleX < 0) paddleX = 0;
    if(paddleX > canvas.width - paddleWidth) paddleX = canvas.width - paddleWidth;
    touchX = currentX;
});

document.addEventListener('keydown', e => { if(e.key == "Right" || e.key == "ArrowRight") rightPressed = true; if(e.key == "Left" || e.key == "ArrowLeft") leftPressed = true; });
document.addEventListener('keyup', e => { if(e.key == "Right" || e.key == "ArrowRight") rightPressed = false; if(e.key == "Left" || e.key == "ArrowLeft") leftPressed = false; });

draw();
</script>
</body>
</html>
