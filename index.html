<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) || (e.ctrlKey && e.key === 'u')) {
            e.preventDefault();
            return false;
        }
    });
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>黯机游戏大全</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #0d0d1a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        padding: 20px 15px;
    }
    .container {
        width: 100%;
        max-width: 480px;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 20px;
        border-bottom: 1px solid #22223a;
        margin-bottom: 20px;
    }
    .logo {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #f5c842;
    }
    .tabs {
        display: flex;
        gap: 15px;
    }
    .tab {
        color: #555;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.3s;
    }
    .tab.active {
        color: #f5c842;
    }
    .tab.active::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 100%;
        height: 2px;
        background: #f5c842;
    }

    .page { display: none; }
    .page.active { display: block; }

    /* ======= 滑动公告栏 ======= */
    .notice-wrapper {
        width: 100%;
        background: #e94560;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 20px;
        padding: 12px 0;
        box-shadow: 0 4px 10px rgba(233, 69, 96, 0.3);
    }
    .notice-track {
        display: flex;
        white-space: nowrap;
        /* 修改了这里：方向反转，从右向左滑 */
        animation: scrollNoticeRight 12s linear infinite;
    }
    .notice-item {
        color: #fff;
        font-weight: bold;
        font-size: 15px;
        padding: 0 40px;
        flex-shrink: 0;
    }
    @keyframes scrollNoticeRight {
        0% { transform: translateX(-50%); }
        100% { transform: translateX(0); }
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
    .game-card {
        background: #1a1a2e;
        border-radius: 16px;
        padding: 20px 10px;
        text-align: center;
        text-decoration: none;
        color: #fff;
        border: 1px solid #26263a;
        transition: 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
    }
    .game-card:active {
        transform: scale(0.95);
        border-color: #f5c842;
        background: #22223a;
    }
    .game-card .icon { font-size: 32px; }
    .game-card .name { font-size: 14px; font-weight: 500; color: #ccc; }

    .log-item {
        background: #1a1a2e;
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 10px;
        border: 1px solid #26263a;
    }
    .log-item .date { color: #f5c842; font-size: 13px; font-weight: bold; }
    .log-item .desc { color: #aaa; font-size: 14px; margin-top: 4px; line-height: 1.5; }

    .copyright {
        text-align: center;
        color: #444;
        font-size: 12px;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #1f1f30;
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">黯机</div>
        <div class="tabs">
            <div class="tab active" onclick="switchPage('home')">主页</div>
            <div class="tab" onclick="switchPage('logs')">日志</div>
        </div>
    </div>

    <!-- 向右滑动的公告栏 -->
    <div class="notice-wrapper">
        <div class="notice-track">
            <div class="notice-item">📢 黯机游戏大全已上线！欢迎大家游玩！</div>
            <div class="notice-item">📢 黯机游戏大全已上线！欢迎大家游玩！</div>
        </div>
    </div>

    <div id="home" class="page active">
        <div class="grid">
            <a href="guess.html" class="game-card"><div class="icon">🔢</div><div class="name">猜数字</div></a>
            <a href="snake.html" class="game-card"><div class="icon">🐍</div><div class="name">贪吃蛇</div></a>
            <a href="tictac.html" class="game-card"><div class="icon">❌</div><div class="name">井字棋</div></a>
            <a href="minesweeper.html" class="game-card"><div class="icon">💣</div><div class="name">扫雷</div></a>
            <a href="breakout.html" class="game-card"><div class="icon">🧱</div><div class="name">打砖块</div></a>
            <a href="sokoban.html" class="game-card"><div class="icon">📦</div><div class="name">推箱子</div></a>
            <a href="piano.html" class="game-card"><div class="icon">🎹</div><div class="name">别踩白块</div></a>
            <a href="mastermind.html" class="game-card"><div class="icon">💣</div><div class="name">拆弹专家</div></a>
            <a href="neon_snake.html" class="game-card"><div class="icon">🐍</div><div class="name">霓虹贪吃蛇</div></a>
            <a href="shooter.html" class="game-card"><div class="icon">✈️</div><div class="name">像素飞机大战</div></a>
            <a href="memory.html" class="game-card"><div class="icon">🎃</div><div class="name">记忆翻牌</div></a>
            <a href="math.html" class="game-card"><div class="icon">☃️</div><div class="name">数学大挑战</div></a>
            <a href="star_match.html" class="game-card"><div class="icon">🧊</div><div class="name">星穹三消</div></a>
            <a href="goban.html" class="game-card"><div class="icon">🐂</div><div class="name">AI智能五子棋</div></a>
            <a href="whack.html" class="game-card"><div class="icon">👽</div><div class="name">打地鼠</div></a>
            <a href="tetris.html" class="game-card"><div class="icon">☠️</div><div class="name">俄罗斯方块</div></a>
            <a href="racer.html" class="game-card"><div class="icon">🐿️</div><div class="name">像素赛车</div></a>
            <a href="https://drifthunter.org/zh/games/subway-surfers" target="_blank" class="game-card" style="border-color:#e94560;"><div class="icon">🚇</div><div class="name">地铁跑酷</div></a>
            <a href="ab_group.html" class="game-card"><div class="icon">👾</div><div class="name">加入QQ群</div></a>
            <a href="about.html" class="game-card"><div class="icon">💀</div><div class="name">关于开发者</div></a>
        </div>
    </div>

    <div id="logs" class="page">
        <div class="log-item">
            <div class="date">2026.07.31</div>
            <div class="desc">✨ 公告栏改为向右滑动效果。</div>
        </div>
        <div class="log-item">
            <div class="date">2026.07.30</div>
            <div class="desc">🚀 迁移至 GitHub Pages。</div>
        </div>
    </div>

    <div class="copyright">© 2026 黯机游戏大全</div>
</div>

<script>
    function switchPage(id) {
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        let tabs = document.querySelectorAll('.tab');
        let map = {'home': 0, 'logs': 1};
        if(map[id] !== undefined) tabs[map[id]].classList.add('active');
    }
</script>

</body>
</html>
