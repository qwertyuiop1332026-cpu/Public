<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数学大挑战</title>
<style>
body{text-align:center;font-family:sans-serif;background:#1a1a2e;color:white;touch-action:manipulation;padding:10px;margin:0;}
canvas{display:block;width:100vw;height:100vh;background:#1a1a2e;}
#ui{position:absolute;top:10px;left:10px;color:#fff;font-size:16px;pointer-events:none;}
#ui span{color:#f5c842;}
#ui .red{color:#e94560;}
</style>
</head>
<body>
<div id="ui">✅ 答对: <span id="score">0</span> | ❌ 答错: <span id="miss" class="red">0</span>/3</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const missEl = document.getElementById('miss');

let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);

let currentQuestion = null, options = [];
let score = 0, miss = 0, gameRunning = true, fallY = 30, speed = 2.5;

function generateQuestion() {
    let a = Math.floor(Math.random() * 20) + 1, b = Math.floor(Math.random() * 20) + 1;
    let op = Math.random() > 0.5 ? '+' : '-';
    if(op === '-' && a < b) { let t = a; a = b; b = t; }
    let answer = op === '+' ? a + b : a - b;
    currentQuestion = { text: `${a} ${op} ${b} = ?`, answer: answer };
    options = [answer];
    while(options.length < 4) {
        let fake = answer + Math.floor(Math.random() * 10) - 5;
        if(fake !== answer && !options.includes(fake) && fake > 0) options.push(fake);
    }
    for(let i=options.length-1; i>0; i--) { let j = Math.floor(Math.random() * (i+1)); [options[i], options[j]] = [options[j], options[i]]; }
    fallY = 30; speed = 2.5 + score * 0.05; 
}

function selectAnswer(selected) {
    if(!gameRunning || !currentQuestion) return;
    
    // 1. 立即保存当前问题和答案的快照
    let snapshot = {
        answer: currentQuestion.answer,
        isCorrect: selected === currentQuestion.answer
    };

    // 2. 立刻抹除当前数据，防止后续连发触发
    let oldScore = score, oldMiss = miss;
    
    if(snapshot.isCorrect) {
        oldScore++;
        scoreEl.textContent = oldScore;
    } else {
        oldMiss++;
        missEl.textContent = oldMiss;
    }

    // 3. 销毁内存中的题目，绝不让下一次点击找到它
    currentQuestion = null; 
    options = [];
    
    // 4. 判断游戏状态
    if(snapshot.isCorrect) {
        score = oldScore;
        generateQuestion();
    } else {
        miss = oldMiss;
        if(miss >= 3) { 
            gameRunning = false; 
            setTimeout(() => { alert(`💀 答错 3 次，游戏结束！\n最终答对数：${score}`); location.reload(); }, 300); 
        } else { 
            generateQuestion(); 
        }
    }
}

function update() {
    if(!gameRunning || !currentQuestion) return;
    fallY += speed;
    if(fallY > H - 80) {
        // 掉到底部时，如果当前有题，按答错处理，同时销毁数据
        let snapshotAns = currentQuestion.answer;
        currentQuestion = null; // 立刻销毁
        options = [];
        
        miss++;
        missEl.textContent = miss;
        if(miss >= 3) { gameRunning = false; setTimeout(() => { alert(`💀 答错 3 次，游戏结束！\n最终答对数：${score}`); location.reload(); }, 300); }
        else { generateQuestion(); }
    }
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    if(!currentQuestion) return;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(currentQuestion.text, W/2, fallY);
    let btnW = 70, btnH = 50, totalW = btnW * 4 + 20 * 3, startX = (W - totalW) / 2, startY = H - 70;
    for(let i=0; i<4; i++) {
        let x = startX + i * (btnW + 20);
        ctx.fillStyle = '#2d2d3d'; ctx.fillRect(x, startY, btnW, btnH);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 24px sans-serif'; ctx.fillText(options[i], x + btnW/2, startY + btnH/2);
    }
}

canvas.addEventListener('click', e => {
    let rect = canvas.getBoundingClientRect(); let mx = e.clientX - rect.left, my = e.clientY - rect.top;
    let btnW = 70, btnH = 50, totalW = btnW * 4 + 20 * 3, startX = (W - totalW) / 2, startY = H - 70;
    for(let i=0; i<4; i++) { let x = startX + i * (btnW + 20); if(mx > x && mx < x + btnW && my > startY && my < startY + btnH) { selectAnswer(options[i]); break; } }
});
canvas.addEventListener('touchstart', e => {
    let touch = e.touches[0]; let rect = canvas.getBoundingClientRect();
    let mx = touch.clientX - rect.left, my = touch.clientY - rect.top;
    let btnW = 70, btnH = 50, totalW = btnW * 4 + 20 * 3, startX = (W - totalW) / 2, startY = H - 70;
    for(let i=0; i<4; i++) { let x = startX + i * (btnW + 20); if(mx > x && mx < x + btnW && my > startY && my < startY + btnH) { selectAnswer(options[i]); break; } }
});

generateQuestion();
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
