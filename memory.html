<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>记忆翻牌</title>
<style>
body{text-align:center;font-family:sans-serif;background:#1a1a2e;color:white;padding:10px;touch-action:manipulation;}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px;margin:10px auto;}
.card{aspect-ratio:1;background:#e94560;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;color:white;transition:0.3s;user-select:none;}
.card.flipped{background:#f5c842;color:#1a1a2e;}
.card.matched{background:#4CAF50;color:#1a1a2e;cursor:default;} /* 配对后鼠标变成默认，禁止点击 */
#status{font-size:20px;margin:10px;}
#pairs{color:#f5c842;}
button{padding:10px 20px;background:#e94560;color:white;border:none;border-radius:8px;font-size:16px;margin:10px;cursor:pointer;}
</style>
</head>
<body>
<h1>🧠 记忆翻牌</h1>
<div>已配对：<span id="pairs">0</span> / 8</div>
<div id="status">翻两张一样的牌</div>
<div id="grid"></div>
<button onclick="initMemory()">重新开始</button>
<script>
const emojis=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
let cards=[], flipped=[], matched=0, lock=false;

function initMemory(){
    cards=[...emojis,...emojis];
    for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
    flipped=[]; matched=0; lock=false;
    document.getElementById('pairs').innerText='0';
    document.getElementById('status').innerText='翻两张一样的牌';
    renderMemory();
}

function renderMemory(){
    let grid=document.getElementById('grid');
    grid.innerHTML='';
    for(let i=0;i<cards.length;i++){
        let card=document.createElement('div');
        card.className='card';
        card.dataset.index=i;
        
        // 状态判定：配对 > 翻开 > 背面
        if(cards[i] === 'matched'){ // 配对状态
            card.classList.add('matched');
            card.innerText='✔️'; // 或者保持原来的图案，看你喜欢
        } else if(flipped.includes(i)){
            card.classList.add('flipped');
            card.innerText=cards[i];
        }
        
        card.addEventListener('click',()=>flipCard(i));
        grid.appendChild(card);
    }
}

function flipCard(index){
    // 【核心修复】如果锁定、已配对、或者已经在翻牌列表里，直接拦截
    if(lock) return;
    if(cards[index] === 'matched') return; 
    if(flipped.includes(index)) return;
    if(flipped.length === 2) return; // 如果已经翻开两张，不能点第三张

    flipped.push(index);
    renderMemory();

    // 如果正好翻开了两张，开始判断
    if(flipped.length === 2){
        lock = true; // 【核心修复】立刻锁定，防止点第三张
        let idx1 = flipped[0];
        let idx2 = flipped[1];
        
        if(cards[idx1] === cards[idx2]){
            // 配对成功！
            cards[idx1] = 'matched';
            cards[idx2] = 'matched';
            matched++;
            document.getElementById('pairs').innerText=matched;
            flipped = [];
            lock = false; // 解锁
            renderMemory(); // 立刻刷新成绿色
            
            if(matched === 8){
                document.getElementById('status').innerText='🎉 全配对成功，你太棒了！';
            }
        } else {
            // 配对失败
            document.getElementById('status').innerText='不一样，记住位置！';
            setTimeout(()=>{
                flipped = [];
                lock = false; // 【核心修复】时间到解锁
                document.getElementById('status').innerText='翻两张一样的牌';
                renderMemory();
            }, 800);
        }
    }
}
initMemory();
</script>
</body>
</html>
