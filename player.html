<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>背景音乐框架</title>
<style>
    body { margin: 0; padding: 0; background: #1a1a2e; }
    iframe { width: 100%; height: 100vh; border: none; display: block; }

    /* 固定在右上角的音乐图标 */
    #music-box {
        position: fixed;
        bottom: 20px;
        left: 20px;
        width: 44px;
        height: 44px;
        background: #2a2a5e;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 22px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        z-index: 999;
        user-select: none;
        border: 1px solid #4a4a8e;
        transition: 0.2s;
    }
    #music-box:active { transform: scale(0.9); }
    #music-box.muted { background: #4a4a5a; color: #888; }

    /* 隐藏的音频标签 */
    audio { display: none; }
</style>
</head>
<body>

    <!-- 核心：用 iframe 显示你想看的游戏页面 -->
    <iframe id="gameFrame" src="index.html"></iframe>

    <!-- 永远不会消失的音乐控件 -->
    <div id="music-box" onclick="toggleMusic()">🔊</div>

    <audio id="bgm" src="bgm.mp3" loop></audio>

    <script>
        const audio = document.getElementById('bgm');
        const btn = document.getElementById('music-box');

        // 点一次激活
        document.addEventListener('click', function() {
            if (audio.paused) {
                audio.play().catch(() => {});
            }
        }, { once: true });

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                btn.textContent = '🔊';
                btn.classList.remove('muted');
            } else {
                audio.pause();
                btn.textContent = '🔇';
                btn.classList.add('muted');
            }
        }

        // 监听 iframe 内部点击（确保在游戏里点也能激活音乐）
        window.addEventListener('message', function(e) {
            if (e.data === 'click') {
                if (audio.paused) audio.play().catch(() => {});
            }
        });
    </script>

</body>
</html>
