<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>像素飞机大战</title>
<style>
body{margin:0;overflow:hidden;background:#0a0a1a;touch-action:none;font-family:sans-serif;}
canvas{display:block;margin:0 auto;background:#000;width:100vw;height:100vh;}
#ui{position:absolute;top:20px;left:20px;color:#fff;font-size:20px;pointer-events:none;}
#ui span{color:#f5c842;}
#go{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;padding:30px;border:1px solid #e94560;border-radius:10px;text-align:center;}
#go button{padding:10px 25px;margin-top:15px;background:#e94560;color:#fff;border:none;border-radius:5px;font-size:18px;cursor:pointer;}
</style>
</head>
<body>
<div id="ui">得分: <span id="score">0</span></div>
<div id="go"><h1>💥 坠毁</h1><p>得分: <span id="fs">0</span></p><button onclick="location.reload()">重新起飞</button></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let player = {x: W/2, y: H - 80, w: 30, h: 30};
let bullets = [];
let enemies = [];
let score = 0;
let gameOver = false;
let shootTimer = 0;
let enemyTimer = 0;
let touchX = W/2;

function drawPlayer() {
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(player.x - player.w/2, player.y - player.h/2, player.w, player.h);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - player.h/2 - 10);
    ctx.lineTo(player.x - 10, player.y - 5);
    ctx.lineTo(player.x + 10, player.y - 5);
    ctx.fill();
}

function update() {
    if(gameOver) return;
    player.x += (touchX - player.x) * 0.15;
    if(player.x < player.w/2) player.x = player.w/2;
    if(player.x > W - player.w/2) player.x = W - player.w/2;

    shootTimer++;
    if(shootTimer > 8) {
        bullets.push({x: player.x, y: player.y - player.h/2 - 5, w: 3, h: 12});
        shootTimer = 0;
    }

    enemyTimer++;
    if(enemyTimer > 40 - Math.min(30, score/2)) {
        let size = 15 + Math.random() * 15;
        enemies.push({x: Math.random() * (W - size) + size/2, y: -size, w: size, h: size, speed: 2 + score/8});
        enemyTimer = 0;
    }

    for(let i=bullets.length-1; i>=0; i--) { bullets[i].y -= 8; if(bullets[i].y < -20) bullets.splice(i,1); }
    for(let i=enemies.length-1; i>=0; i--) { let e = enemies[i]; e.y += e.speed; if(e.y > H + 20) enemies.splice(i,1); }

    for(let i=bullets.length-1; i>=0; i--) {
        let b = bullets[i];
        for(let j=enemies.length-1; j>=0; j--) {
            let e = enemies[j];
            if(b.x > e.x - e.w/2 && b.x < e.x + e.w/2 && b.y > e.y - e.h/2 && b.y < e.y + e.h/2) {
                bullets.splice(i,1); enemies.splice(j,1);
                score += 10; scoreEl.textContent = score;
                break;
            }
        }
    }

    for(let e of enemies) {
        if(Math.abs(player.x - e.x) < (player.w/2 + e.w/2) && Math.abs(player.y - e.y) < (player.h/2 + e.h/2)) {
            gameOver = true;
            document.getElementById('fs').textContent = score;
            document.getElementById('go').style.display = 'block';
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    drawPlayer();
    ctx.fillStyle = '#f5c842';
    bullets.forEach(b => ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h));
    ctx.fillStyle = '#e94560';
    enemies.forEach(e => ctx.fillRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h));
}

canvas.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
canvas.addEventListener('touchmove', e => { touchX = e.touches[0].clientX; });

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
