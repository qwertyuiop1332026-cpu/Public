<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星穹三消</title>
<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: sans-serif;
        touch-action: manipulation;
        overflow: hidden;
    }

    #game {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 20px;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        text-align: center;
        max-width: 400px;
        width: 100%;
    }

    #top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #fff;
        margin-bottom: 15px;
        padding: 0 5px;
    }

    #score {
        font-size: 18px;
        background: rgba(0,0,0,0.3);
        padding: 6px 16px;
        border-radius: 30px;
        border: 1px solid rgba(255, 215, 0, 0.3);
    }
    #score span { color: #f5c842; font-weight: bold; }

    #btn-reset {
        background: #e94560;
        border: none;
        padding: 8px 20px;
        border-radius: 30px;
        color: #fff;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 0 #a03245;
        transition: 0.1s;
    }
    #btn-reset:active { transform: translateY(4px); box-shadow: none; }

    #grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 8px;
        aspect-ratio: 1 / 1;
        background: rgba(0,0,0,0.2);
        padding: 8px;
        border-radius: 16px;
    }

    .cell {
        aspect-ratio: 1;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        transition: 0.1s;
        box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2);
    }
    .cell:active { transform: scale(0.85); }
    .cell.selected { box-shadow: 0 0 0 3px #fff, 0 0 15px rgba(255,255,255,0.5); transform: scale(1.05); }
    .cell.empty { background: transparent !important; box-shadow: none; }

    .combo-text {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #f5c842;
        font-size: 40px;
        font-weight: bold;
        text-shadow: 0 0 20px rgba(245, 200, 66, 0.8);
        pointer-events: none;
        animation: comboAnim 0.8s ease-out forwards;
    }

    @keyframes comboAnim {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
        100% { opacity: 0; transform: translate(-50%, -80%) scale(1.5); }
    }
</style>
</head>
<body>

<div id="game">
    <div id="top-bar">
        <div id="score">✨ <span id="scoreNum">0</span></div>
        <button id="btn-reset" onclick="initGame()">重新洗牌</button>
    </div>
    <div id="grid"></div>
</div>

<script>
// 六种魔法宝石图标
const TYPES = ['💎', '🔮', '💠', '⭐', '🌙', '☀️'];
const ROWS = 8;
const COLS = 8;
let board = [];
let score = 0;
let selectedRow = -1, selectedCol = -1;
let isProcessing = false;

function initGame() {
    board = [];
    score = 0;
    selectedRow = -1; selectedCol = -1;
    isProcessing = false;
    document.getElementById('scoreNum').innerText = '0';
    
    for(let r=0; r<ROWS; r++) {
        let row = [];
        for(let c=0; c<COLS; c++) {
            row.push(Math.floor(Math.random() * TYPES.length));
        }
        board.push(row);
    }
    // 清理初始盘面可能自带的消除
    while(processMatches(true)) {}
    render();
}

function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for(let r=0; r<ROWS; r++) {
        for(let c=0; c<COLS; c++) {
            let cell = document.createElement('div');
            cell.className = 'cell';
            
            let typeIdx = board[r][c];
            if(typeIdx !== -1) {
                cell.innerText = TYPES[typeIdx];
                let colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#a29bfe', '#ff6b81'];
                cell.style.background = colors[typeIdx] + '33'; // 半透明背景
                cell.style.border = '1px solid ' + colors[typeIdx];
            } else {
                cell.classList.add('empty');
            }
            
            if(r === selectedRow && c === selectedCol && typeIdx !== -1) {
                cell.classList.add('selected');
            }
            
            cell.onclick = () => handleClick(r, c);
            grid.appendChild(cell);
        }
    }
}

function handleClick(row, col) {
    if(isProcessing || board[row][col] === -1) return;

    if(selectedRow === -1) {
        selectedRow = row; selectedCol = col;
        render(); return;
    }

    if(selectedRow === row && selectedCol === col) {
        selectedRow = -1; selectedCol = -1;
        render(); return;
    }

    let dr = Math.abs(selectedRow - row);
    let dc = Math.abs(selectedCol - col);
    if((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
        trySwap(selectedRow, selectedCol, row, col);
    } else {
        selectedRow = row; selectedCol = col;
        render();
    }
}

function trySwap(r1, c1, r2, c2) {
    isProcessing = true;
    // 交换
    let temp = board[r1][c1]; board[r1][c1] = board[r2][c2]; board[r2][c2] = temp;

    if(processMatches(false)) {
        selectedRow = -1; selectedCol = -1;
        render();
        setTimeout(() => { fallDown(); }, 400);
    } else {
        // 换回来
        let tempBack = board[r1][c1]; board[r1][c1] = board[r2][c2]; board[r2][c2] = tempBack;
        selectedRow = -1; selectedCol = -1;
        render();
        isProcessing = false;
    }
}

function processMatches(justCheck) {
    let matched = false;
    let toRemove = new Set();

    // 水平三消
    for(let r=0; r<ROWS; r++) {
        for(let c=0; c<COLS-2; c++) {
            if(board[r][c] !== -1 && board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) {
                toRemove.add(r+','+c); toRemove.add(r+','+(c+1)); toRemove.add(r+','+(c+2));
                matched = true;
            }
        }
    }

    // 垂直三消
    for(let c=0; c<COLS; c++) {
        for(let r=0; r<ROWS-2; r++) {
            if(board[r][c] !== -1 && board[r][c] === board[r+1][c] && board[r][c] === board[r+2][c]) {
                toRemove.add(r+','+c); toRemove.add((r+1)+','+c); toRemove.add((r+2)+','+c);
                matched = true;
            }
        }
    }

    if(matched && !justCheck) {
        let count = 0;
        for(let key of toRemove) {
            let [r, c] = key.split(',').map(Number);
            board[r][c] = -1;
            count++;
        }
        score += count * 10;
        document.getElementById('scoreNum').innerText = score;
    }
    return matched;
}

function fallDown() {
    // 重力下落
    for(let c=0; c<COLS; c++) {
        let writeRow = ROWS - 1;
        for(let r=ROWS - 1; r>=0; r--) {
            if(board[r][c] !== -1) {
                board[writeRow][c] = board[r][c];
                if(writeRow !== r) board[r][c] = -1;
                writeRow--;
            }
        }
        // 顶部随机填充
        for(let r=writeRow; r>=0; r--) {
            board[r][c] = Math.floor(Math.random() * TYPES.length);
        }
    }
    render();
    setTimeout(() => {
        if(processMatches(false)) {
            // 连击特效
            let comboText = document.createElement('div');
            comboText.className = 'combo-text';
            comboText.innerText = '🔥 Combo!';
            document.body.appendChild(comboText);
            setTimeout(() => comboText.remove(), 800);
            
            setTimeout(() => { fallDown(); }, 400);
        } else {
            isProcessing = false;
        }
    }, 400);
}

initGame();
</script>
</body>
</html>
