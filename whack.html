<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打地鼠</title>
<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: 'Comic Sans MS', sans-serif;
        touch-action: manipulation;
        overflow: hidden;
    }

    #game-container {
        text-align: center;
        background: rgba(0, 0, 0, 0.3);
        padding: 20px;
        border-radius: 30px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        max-width: 380px;
        width: 100%;
        border: 2px solid #f5c842;
    }

    h1 {
        color: #f5c842;
        margin: 0 0 5px 0;
        font-size: 28px;
        text-shadow: 0 3px 0 #b8860b;
    }

    #score-board {
        background: #16213e;
        padding: 10px;
        border-radius: 15px;
        color: #fff;
        font-size: 22px;
        margin-bottom: 20px;
        border: 1px solid #4a4a5a;
    }
    #score-board span { color: #e94560; font-weight: bold; }

    #grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 20px;
    }

    .hole {
        background: #2d2d3d;
        border-radius: 50%;
        aspect-ratio: 1 / 1;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: inset 0 8px 0 #1a1a2e, 0 10px 20px rgba(0,0,0,0.5);
        transition: transform 0.1s;
        position: relative;
        overflow: hidden;
    }

    .hole:active { transform: scale(0.95); }

    .mole {
        position: absolute;
        width: 80%; height: 80%;
        background: radial-gradient(circle at 40% 35%, #a0522d, #5c3a21);
        border-radius: 50% 50% 40% 40%;
        box-shadow: 0 4px 0 #3b2415, 0 5px 15px rgba(0,0,0,0.5);
        transform: translateY(110%);
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
    }

    .mole.active { transform: translateY(5%); }
    .mole::before {
        content: '👀';
        position: absolute; font-size: 20px;
        top: 15%; left: 50%;
        transform: translateX(-50%);
    }

    #btn-restart {
        background: #e94560; color: white;
        border: none; padding: 12px 30px;
        border-radius: 30px; font-size: 18px; font-weight: bold;
        cursor: pointer; box-shadow: 0 4px 0 #b03a4e;
        transition: 0.1s;
    }
    #btn-restart:active { transform: translateY(4px); box-shadow: none; }
</style>
</head>
<body>

<div id="game-container">
    <h1>🔨 打地鼠</h1>
    <div id="score-board">🎯 得分: <span id="score">0</span></div>
    
    <div id="grid">
        <div class="hole"><div class="mole" data-idx="0"></div></div>
        <div class="hole"><div class="mole" data-idx="1"></div></div>
        <div class="hole"><div class="mole" data-idx="2"></div></div>
        <div class="hole"><div class="mole" data-idx="3"></div></div>
        <div class="hole"><div class="mole" data-idx="4"></div></div>
        <div class="hole"><div class="mole" data-idx="5"></div></div>
        <div class="hole"><div class="mole" data-idx="6"></div></div>
        <div class="hole"><div class="mole" data-idx="7"></div></div>
        <div class="hole"><div class="mole" data-idx="8"></div></div>
    </div>

    <button id="btn-restart" onclick="initGame()">🔄 重来一局</button>
</div>

<script>
const moles = document.querySelectorAll('.mole');
const scoreEl = document.getElementById('score');
let score = 0;
let timeUp = false;
let lastHole = null;

function randomTime(min, max) {
    return Math.round(Math.random() * (max - min) + min);
}

function randomHole() {
    const idx = Math.floor(Math.random() * moles.length);
    const hole = moles[idx];
    if (hole === lastHole || hole.classList.contains('active')) {
        return randomHole();
    }
    lastHole = hole;
    return hole;
}

function peep() {
    if (timeUp) return;
    const hole = randomHole();
    
    // 【核心修改：速度随分数动态变化】
    // 基础速度 800ms，每打中一个地鼠减少 15ms，但最快不低于 350ms
    let baseTime = 800 - (score * 15);
    if (baseTime < 350) baseTime = 350;
    
    // 最终出现的时间在 baseTime 上下浮动 200ms
    const time = randomTime(baseTime - 100, baseTime + 100);
    
    hole.classList.add('active');
    setTimeout(() => {
        hole.classList.remove('active');
        if (!timeUp) peep();
    }, time);
}

function whack(e) {
    if (!e.isTrusted) return;
    if (!this.classList.contains('active')) return;
    
    this.classList.remove('active');
    score++;
    scoreEl.textContent = score;
    
    this.parentElement.style.transform = 'scale(0.85)';
    setTimeout(() => {
        this.parentElement.style.transform = 'scale(1)';
    }, 100);
}

function initGame() {
    score = 0; scoreEl.textContent = '0'; timeUp = false;
    moles.forEach(mole => mole.classList.remove('active'));
    
    setTimeout(() => {
        timeUp = true;
        setTimeout(() => {
            alert(`⏰ 时间到！\n你的最终得分是：${score} 分！`);
        }, 100);
    }, 15000);

    peep();
}

moles.forEach(mole => mole.addEventListener('click', whack));
initGame();
</script>
</body>
</html>
